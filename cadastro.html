<html lang="pt-BR">
    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css"> 

        <title> Cadastro - Biblioteca Pessoal </title>


    </head>

    <body>
        <header class="header">
            <div class="barra-flutuante">
                <form 
                class="pesquisa"
                action="acervo.html"
                method="get"
                >
                <input 
                class="campo-pesquisa"
                id="campo-pesquisa"
                type="search"
                name="busca"
                placeholder="Título, autor ou ISBN..."
                autocomplete="off"
                >
                <button
                class="botao-pesquisa"
                type="submit"
                >
                <span class="icone-pesquisa">🔍</span>
                </button>
                </form>
                <span class="separador-menu"></span>

                <nav class="menu">
                    <a 
                    class="item-menu item-menu--ativo"
                    href="index.html"                    
                    >
                    <span class="icone-menu">⌂</span>
                    <span class="texto-menu">Início</span>
                    </a>
                    <a
                    class="item-menu"
                    href="acervo.html"
                    >
                    <span class="icone-menu">▥</span>
                    <span class="texto-menu">Acervo</span>
                    </a>
                    <a
                    class="item-menu item-menu--cadastro"
                    href="cadastro.html"
                    >
                    <span class="icone-menu">＋</span>
                    <span class="texto-menu">Cadastrar</span>
                    </a>
                </nav>
            </div>
        </header>   


        <main class="conteudo">
            <section class="inicial">
                <div class="banner">
                    <span class="icone-marca">📖</span>
                </div>

                <h1 class="welcome">Cadastro</h1>   

            </section>
        </main>

        <footer class="rodape">
            <div class="conteudo-rodapé">
                <span class="nome-projeto"> Cadastro</span>

                <span class="separador-rodape">•</span>

                <span class="versao-projeto"> v0.1 </span>
            </div>
        </footer>




    </body>



</html>
